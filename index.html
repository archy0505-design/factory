<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화재안전 실태조사 대상 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff2;--sf:#fff;--ink:#16222e;--mut:#5a6a79;--line:#d5dce3;--link:#0a5aa8;
--s1:#b0432e;--s2:#9a6a08;--s3:#2c6a58;box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
html{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
body{margin:0;padding-bottom:60px}
header{background:var(--ink);color:#fff;padding:18px 20px 14px}
h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:#aebccb;font-size:.85rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{font:inherit;border:1px solid var(--line);background:var(--sf);border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--ink)}
.tab b{font-weight:700;margin-left:6px}
.tab[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select,.btn{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--sf);color:var(--ink)}
input[type=search]{flex:1 1 280px;min-width:0}
.btn{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.stat{margin:8px 0 0;color:var(--mut);font-size:.85rem}
main{padding:14px 20px;max-width:1180px;margin:0 auto}
h2{font-size:1rem;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
h2 span{color:var(--mut);font-weight:400;font-size:.85rem}
.g{background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;margin-bottom:8px}
.gh{display:flex;gap:12px;padding:10px 12px;cursor:pointer;align-items:flex-start}
.gh:hover{background:#f6f8fa}
.cnt{flex:none;min-width:58px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:.8rem;color:var(--mut)}
.cnt b{display:block;font-size:1.1rem;color:var(--ink);line-height:1.2}
.cnt i{display:block;font-style:normal;font-size:.7rem;transition:transform .15s}
.open>.gh .cnt i{transform:rotate(180deg)}
.main{flex:1;min-width:0}
.addr{display:block;font-weight:700;color:var(--link);text-decoration:none;word-break:keep-all}
.addr:hover{text-decoration:underline}
.addr small{font-weight:400;color:var(--mut)}
.addr svg{vertical-align:-2px;margin-right:4px}
.jib{display:inline-block;font-size:.72rem;background:#eef1f4;color:var(--mut);border-radius:4px;padding:0 6px;margin-left:6px;font-weight:400}
.meta{color:var(--mut);font-size:.85rem;margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink);background:#f6f8fa}
.tag.hot{border-color:#e0a99f;background:#fbeeeb;color:#8c2f1d}
.det{display:none;border-top:1px solid var(--line);overflow-x:auto}
.open>.det{display:block}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:860px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid #eaeef2;vertical-align:top}
th{background:#f6f8fa;font-weight:500;color:var(--mut);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
mark{background:#ffe58a;color:inherit;border-radius:2px}
.empty{text-align:center;color:var(--mut);padding:50px 0}
@media (max-width:640px){header,.bar,main{padding-left:12px;padding-right:12px}.gh{gap:8px}}
.memo{padding:10px 12px;border-top:1px dashed var(--line);background:#fbfcfd}
.memo label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}
.memo textarea{width:100%;min-height:56px;resize:vertical;font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink)}
.memo small{margin-left:8px}
.tag.memo{background:#fff6d6;border-color:#e6cf7a;color:#5c4a00;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{display:flex;align-items:center;gap:5px;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<header>
<h1>화재안전 실태조사 대상 조회</h1>
<p class="sub">창원시 진해구 공장·창고 · 도로명주소별 묶음 · 주소를 누르면 선택한 지도(구글·네이버)가 새 창으로 열리고, 지번별로 메모를 남길 수 있습니다</p>
</header>
<div class="bar">
<div class="tabs" id="tabs"></div>
<div class="row">
<input id="q" type="search" placeholder="도로명, 지번, 건축물명, 동명칭으로 검색 (예: 남의로, 쯔바키, 원포동)" aria-label="검색">
<select id="dong" aria-label="읍면동"></select>
<select id="sort" aria-label="정렬">
<option value="addr">주소순</option><option value="cnt">동 수 많은 순</option><option value="area">연면적 큰 순</option>
</select>
<select id="map" aria-label="지도 선택"><option value="google">지도: 구글</option><option value="naver">지도: 네이버</option></select>
<label class="chk"><input type="checkbox" id="onlym"> 메모 있는 것만</label>
<button class="btn" id="all">모두 펼치기</button><button class="btn" id="none">모두 접기</button><button class="btn" id="reset">초기화</button>
<button class="btn" id="xl">엑셀 다운로드</button><button class="btn" id="mex">메모 내보내기</button><button class="btn" id="mim">메모 불러오기</button><input type="file" id="mfile" accept=".json,application/json" hidden>
</div>
<p class="stat" id="stat"></p>
</div>

  return D.filter(r=>(stage==='all'||r.st===stage)&&(!dong||r.dong===dong)&&(!onlyM||memoOf(r.j))&&toks.every(t=>(r.hay+' '+memoOf(r.j).toLowerCase()).includes(t)));
}
function group(rows){
  const m=new Map();
  rows.forEach(r=>{const id=r.st+'|'+r.k;let g=m.get(id);if(!g)m.set(id,g={id,k:r.k,st:r.st,rows:[],area:0,r:r.r,j:r.j,dong:r.dong});g.rows.push(r);g.area+=r.a||0});
  return [...m.values()];
}
function addrHtml(g){
  if(!g.r) return `<a class="addr" href="${mapUrl(g.j)}" target="_blank" rel="noopener">${PIN}${hl(g.j)}</a><span class="jib">도로명주소 없음 · 지번으로 검색</span>`;
  return g.r.split(/(?<=\))\s*,\s*/).map(a=>{
    const s=a.startsWith(PRE)?a.slice(PRE.length):a;
    return `<a class="addr" href="${mapUrl(a)}" target="_blank" rel="noopener" title="${MAPN()}에서 검색: ${esc(a)}">${PIN}<small>${PRE}</small>${hl(s)}</a>`}).join('');
}
function tags(g){
  const mj=[...new Set(g.rows.map(r=>r.j))].filter(memoOf);
  const mt=mj.map(j=>`<span class="tag memo" title="${esc(memoOf(j))}">✎ ${esc(j.split(' ').slice(3).join(' '))}: ${esc(memoOf(j).replace(/\s+/g,' ').slice(0,24))}</span>`).join('');
  return mt+FLAGS.map(([k,l])=>{const n=g.rows.filter(r=>r[k]).length;return n?`<span class="tag${HOT.has(k)?' hot':''}">${l} ${n}</span>`:''}).join('');
}
function detail(g){
  const h='<table><thead><tr><th>건축물명칭</th><th>동명칭</th><th>용도</th><th>연면적(㎡)</th><th>층수 지상/지하</th><th>높이(m)</th><th>허가일</th><th>사용승인일</th><th>지번주소</th><th>표시</th></tr></thead><tbody>';
  return h+g.rows.map(r=>`<tr><td>${hl(r.n)}</td><td>${hl(r.d)}</td><td>${esc(r.y)}${r.yy?' · '+esc(r.yy):''}</td><td class="n">${fmt(r.a)}</td><td class="n">${r.fa??'-'} / ${r.fb??'-'}</td><td class="n">${fmt(r.h)}</td><td>${dt(r.p)}</td><td>${dt(r.u)}</td><td>${hl(r.j.replace('경상남도 창원시 ',''))}</td><td>${FLAGS.filter(([k])=>r[k]).map(([k,l])=>l).join(', ')}</td></tr>`).join('')+'</tbody></table>'+memoBlocks(g);
}
function memoBlocks(g){
  return [...new Set(g.rows.map(r=>r.j))].map(j=>{
    const nm=[...new Set(g.rows.filter(r=>r.j===j).map(r=>r.n).filter(Boolean))].join(', ');
    return `<div class="memo"><label>메모 · ${esc(j.replace('경상남도 창원시 ',''))}${nm?' ('+esc(nm.length>40?nm.slice(0,40)+'…':nm)+')':''}<small>${M[j]&&M[j].u?'저장됨 '+M[j].u:''}</small></label><textarea data-j="${esc(j)}" placeholder="이 지번 사업장에 대한 메모를 입력하세요 (자동 저장)">${esc(memoOf(j))}</textarea></div>`}).join('');
}
function card(g,i){
  const names=[...new Set(g.rows.map(r=>r.n).filter(Boolean))];
  const isOpen=opened.has(g.id)||!!q;
  const nm=names.length?hl(names.slice(0,3).join(', ')+(names.length>3?` 외 ${names.length-3}`:'')):'<span style="opacity:.7">건축물명칭 없음</span>';
  return `<article class="g${isOpen?' open':''}" style="--c:${COL[g.st]}" data-i="${i}"><div class="gh" role="button" tabindex="0" aria-expanded="${isOpen}"><div class="cnt"><b>${g.rows.length}</b>동<i>▼</i></div><div class="main">${addrHtml(g)}<div class="meta">${esc(g.dong||'')} · 연면적 합계 ${fmt(Math.round(g.area*100)/100)}㎡ · ${nm}</div><div class="tags">${tags(g)}</div></div></div><div class="det">${isOpen?detail(g):''}</div></article>`;
}
function render(){
  re=q.trim()?new RegExp(q.trim().split(/\s+/).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi'):null;
  const rows=rowsNow();G=group(rows);
  const cmp={addr:(a,b)=>a.k.localeCompare(b.k,'ko',{numeric:true}),cnt:(a,b)=>b.rows.length-a.rows.length||a.k.localeCompare(b.k,'ko',{numeric:true}),area:(a,b)=>b.area-a.area}[sort];
  G.sort(cmp);
  const ar=rows.reduce((s,r)=>s+(r.a||0),0);
  $('#stat').textContent=`도로명주소 묶음 ${G.length}개 · 건축물 ${rows.length}동 · 연면적 합계 ${fmt(Math.round(ar))}㎡`;
  const stages=stage==='all'?['1','2','3']:[stage];
  let html='';
  stages.forEach(s=>{
    const gs=G.map((g,i)=>[g,i]).filter(([g])=>g.st===s);
    if(!gs.length)return;
    if(stage==='all')html+=`<h2 style="--c:${COL[s]}">${ST[s]} <span>주소 ${gs.length}개 · ${gs.reduce((n,[g])=>n+g.rows.length,0)}동</span></h2>`;
    html+=gs.map(([g,i])=>card(g,i)).join('');
  });
  $('#list').innerHTML=html||'<p class="empty">조건에 맞는 대상이 없습니다.</p>';
}
function tabs(){
  const c={all:D.length};D.forEach(r=>c[r.st]=(c[r.st]||0)+1);
  $('#tabs').innerHTML=[['all','전체'],['1','1단계'],['2','2단계'],['3','3단계']].map(([k,l])=>`<button class="tab" data-s="${k}" aria-pressed="${stage===k}">${l}<b>${c[k]||0}</b></button>`).join('');
}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;stage=b.dataset.s;tabs();render()};
$('#q').oninput=e=>{q=e.target.value;render()};
$('#dong').onchange=e=>{dong=e.target.value;render()};
$('#sort').onchange=e=>{sort=e.target.value;render()};
$('#all').onclick=()=>{G.forEach(g=>opened.add(g.id));render()};
$('#none').onclick=()=>{opened.clear();$('#q').value='';q='';render()};
$('#reset').onclick=()=>{onlyM=false;$('#onlym').checked=false;stage='all';q='';dong='';sort='addr';$('#q').value='';$('#dong').value='';$('#sort').value='addr';opened.clear();tabs();render()};
$('#onlym').onchange=e=>{onlyM=e.target.checked;render()};
$('#list').addEventListener('input',e=>{
  const t=e.target,j=t.dataset&&t.dataset.j;if(!j)return;
  if(t.value.trim())M[j]={t:t.value,u:stamp()};else delete M[j];
  saveM();
  const sm=t.parentElement.querySelector('small');if(sm)sm.textContent=M[j]?'저장됨 '+M[j].u:'';
  const el=t.closest('.g');el.querySelector('.tags').innerHTML=tags(G[+el.dataset.i]);
});
$('#mex').onclick=()=>{
  if(!Object.keys(M).length)return alert('내보낼 메모가 없습니다.');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(M,null,1)],{type:'application/json'}));
  a.download='화재안전실태조사_메모_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#mim').onclick=()=>$('#mfile').click();
$('#mfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const o=JSON.parse(t);let n=0;for(const j in o)if(o[j]&&o[j].t){M[j]=o[j];n++}
    saveM();render();alert(n+'건의 메모를 불러왔습니다. (같은 지번의 기존 메모는 덮어씁니다)')}).catch(()=>alert('메모 파일을 읽을 수 없습니다.'));
  e.target.value='';
};
//XLSX-START
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let r=-1;for(let i=0;i<b.length;i++)r=crcT[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0};
function zip(files){
  const enc=new TextEncoder(),loc=[],cen=[];let off=0;
  const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
  for(const [name,txt] of files){
    const nb=enc.encode(name),d=enc.encode(txt),c=crc32(d),n=u32(d.length);
    const lh=[0x50,0x4b,3,4,20,0,0,8,0,0,0,0,33,0,...u32(c),...n,...n,...u16(nb.length),0,0];
    loc.push(Uint8Array.from(lh),nb,d);
    cen.push(Uint8Array.from([0x50,0x4b,1,2,20,0,20,0,0,8,0,0,0,0,33,0,...u32(c),...n,...n,...u16(nb.length),...new Array(12).fill(0),...u32(off)]),nb);
    off+=lh.length+nb.length+d.length;
  }
  const cs=cen.reduce((a,b)=>a+b.length,0);
  const end=Uint8Array.from([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
  const all=[...loc,...cen,end],out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;
  all.forEach(b=>{out.set(b,p);p+=b.length});return out;
}
const X=s=>String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function buildXlsx(){
  const H=['조사단계','도로명주소','지번주소','건축물명칭','동명칭','허가일','사용승인일','연면적(㎡)','층수(지상)','층수(지하)','높이(m)','주용도','층대표용도','위험물','화재이력','초고위험','고위험','유해화학물질','산단','메모','메모 저장시각'];
  const W=[9,44,30,30,12,11,11,12,9,9,9,10,14,7,7,8,7,10,6,40,14];
  const nat=(a,b)=>a.localeCompare(b,'ko',{numeric:true}),O=v=>v?'O':'';
  const rows=[...D].sort((a,b)=>nat(a.st,b.st)||nat(a.k,b.k)||nat(a.j,b.j)||nat(a.n,b.n));
  const data=rows.map(r=>[ST[r.st],r.r||'(도로명주소 없음)',r.j,r.n,r.d,dt(r.p),dt(r.u),r.a,r.fa,r.fb,r.h,r.y,r.yy,O(r.dg),O(r.fh),O(r.s1),O(r.s2),O(r.ch),O(r.ind),memoOf(r.j),(M[r.j]&&M[r.j].u)||'']);
  const L=i=>String.fromCharCode(65+i);
  const cell=(v,ri,ci,st)=>{const ref=L(ci)+(ri+1),a=st?` s="${st}"`:'';
    if(v==null||v==='')return `<c r="${ref}"${a}/>`;
    if(typeof v==='number')return `<c r="${ref}"${a}><v>${v}</v></c>`;
    return `<c r="${ref}"${a} t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`};
  const sd=[H,...data].map((row,ri)=>`<row r="${ri+1}">`+row.map((v,ci)=>cell(v,ri,ci,ri===0?1:ci===7?3:ci===19?2:0)).join('')+'</row>').join('');
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',RN='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PR='http://schemas.openxmlformats.org/package/2006/relationships';
  const hd='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return zip([
    ['[Content_Types].xml',hd+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels',hd+`<Relationships xmlns="${PR}"><Relationship Id="rId1" Type="${RN}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',hd+`<workbook ${NS} xmlns:r="${RN}"><sheets><sheet name="실태조사 대상" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',hd+`<Relationships xmlns="${PR}"><Relationship Id="rId1" Type="${RN}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${RN}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',hd+`<styleSheet ${NS}><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDE5EC"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ['xl/worksheets/sheet1.xml',hd+`<worksheet ${NS}><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${W.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${sd}</sheetData><autoFilter ref="A1:U${data.length+1}"/></worksheet>`]
  ]);
}
//XLSX-END
$('#map').value=MAP;
$('#map').onchange=e=>{MAP=e.target.value;try{localStorage.setItem('fsurvey-map',MAP)}catch(x){}render()};
$('#xl').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buildXlsx()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='화재안전실태조사_대상목록_메모포함_'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
function toggle(el){
  const g=G[+el.dataset.i],open=!el.classList.contains('open');
  el.classList.toggle('open',open);el.querySelector('.gh').setAttribute('aria-expanded',open);
  if(open){opened.add(g.id);const d=el.querySelector('.det');if(!d.firstChild)d.innerHTML=detail(g)}else opened.delete(g.id);
}
$('#list').onclick=e=>{if(e.target.closest('a'))return;const gh=e.target.closest('.gh');if(gh)toggle(gh.parentElement)};
$('#list').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('gh')){e.preventDefault();toggle(e.target.parentElement)}};
const dongs=[...new Set(D.map(r=>r.dong).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
$('#dong').innerHTML='<option value="">전체 읍면동</option>'+dongs.map(d=>`<option>${d}</option>`).join('');
tabs();render();
</script>
